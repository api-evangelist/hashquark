aid: hashquark
name: HashKey Cloud (HashQuark)
description: >-
  HashKey Cloud, formerly HashQuark, is a Hong Kong-based blockchain
  infrastructure and Web3 staking provider (part of HashKey Group) that runs
  enterprise-grade validator nodes across 50+ mainstream proof-of-stake public
  chains including Ethereum, Cosmos, Solana, Polkadot, Avalanche, Sui and BNB
  Chain. It exposes a developer platform for institutional staking: a Staking
  API to onboard users, generate deposits, assign and exit validators and drive
  pooled staking; a Data API to track node status and daily/monthly/quarterly/
  annual reward data; plus a dashboard, a Babylon BTC staking flow and a
  first-party Go SDK. Requests are authenticated with a custom
  Quark-Keccak256-ECDSA request-signing scheme keyed to an Ethereum keypair.
  Originally added to the API Evangelist network as a portfolio-lead stub
  (surfaced via Qiming), now enriched from HashKey Cloud's public developer
  surface.
